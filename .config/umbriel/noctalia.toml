urgent_text = "#251a18FF"

[colors.title_bar]
background = "#3a2d2cFF"
background_unfocused = "#231b1aFF"
text = "#f3f2f2FF"
text_unfocused = "#b6afafFF"
close = "#fd4663FF"
maximize = "#e47267FF"
minimize = "#d6a35cFF"

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#c4cc66FF"
border_color_unfocused = "#5f641bFF"
